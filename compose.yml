# AI Command Center: full stack.
#   First run:  scripts/init-env.sh   (creates .env with random secrets)
#   Start:      docker compose up -d --build --wait
#   Dev mode:   docker compose -f compose.yml -f compose.dev.yml up -d --build --wait
#   Production: docker compose -f compose.yml -f compose.prod.yml up -d --build --wait
name: acc

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  ACC_ENV: ${ACC_ENV:-development}
  ACC_DATABASE_URL: postgresql+asyncpg://acc_app:${ACC_APP_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/acc
  ACC_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://acc_owner:${ACC_OWNER_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/acc
  ACC_REDIS_URL: redis://:${REDIS_PASSWORD:?run scripts/init-env.sh}@redis:6379/0
  ACC_SESSION_SECRET: ${ACC_SESSION_SECRET:?run scripts/init-env.sh}
  # Signs/verifies per-run tokens (PLAN-PHASE-2-M2.md §2.4). api verifies them on
  # /internal/*; orchestrator mints them at launch. Both need the same secret.
  ACC_RUNNER_TOKEN_SECRET: ${ACC_RUNNER_TOKEN_SECRET:?run scripts/init-env.sh}
  ACC_PUBLIC_ORIGIN: ${ACC_PUBLIC_ORIGIN:-http://localhost}
  ACC_LOG_LEVEL: ${ACC_LOG_LEVEL:-INFO}
  # M3 (PLAN-PHASE-2-M3.md §2.2): optional — a task with no linked repository never needs
  # it. Read only by acc.orchestrator.launcher.build_container_config, which injects it
  # into a runner container's GIT_CREDENTIAL env var (never a git remote URL or config
  # file — consumed only via GIT_ASKPASS, runner/git_askpass.py). Was never actually
  # reachable through this file before now — a real gap from M3, found while wiring the
  # M4 settings just below and fixed here rather than left for the first real repository
  # to hit it.
  ACC_GIT_CREDENTIAL: ${ACC_GIT_CREDENTIAL:-}
  # M4 (PLAN-PHASE-2-M4.md §1/§12): optional — a deployment that has never enabled a
  # real adapter on any agent needs none (acc.commands.seed keeps every seeded agent at
  # adapter='none'; enabling one is a deliberate, manual operator action, never
  # automatic). Every run limit below is independently configurable, per the M4 approval
  # message, not hardcoded; unset falls back to Settings' own defaults.
  ACC_ANTHROPIC_API_KEY: ${ACC_ANTHROPIC_API_KEY:-}
  ACC_RUN_MAX_TURNS: ${ACC_RUN_MAX_TURNS:-30}
  ACC_RUN_MAX_WALL_CLOCK_MINUTES: ${ACC_RUN_MAX_WALL_CLOCK_MINUTES:-15}
  ACC_RUN_MAX_COST_USD: ${ACC_RUN_MAX_COST_USD:-2.00}
  # M4.2 (PLAN-PHASE-2-M4.2.md §7): fraction of the wall-clock limit above at which a
  # warning event fires, before the unchanged hard kill at 100%.
  ACC_RUN_TIMEOUT_WARNING_FRACTION: ${ACC_RUN_TIMEOUT_WARNING_FRACTION:-0.8}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: postgres
      # Consumed once by infra/postgres/init/01-roles.sh on first start.
      ACC_OWNER_DB_PASSWORD: ${ACC_OWNER_DB_PASSWORD}
      ACC_APP_DB_PASSWORD: ${ACC_APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the init phase listens on the socket only, so this passes only once init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d acc"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  # One-shot: applies migrations (as the schema owner, acc_owner), then the idempotent seed
  # (as the runtime role, acc_app, through the command layer), then exits.
  migrate:
    build: ./backend
    image: acc-api:local
    command: ["sh", "-c", "alembic upgrade head && acc seed"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  api:
    build: ./backend
    image: acc-api:local
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    # runner-egress: so runner containers can reach /internal/* (PLAN-PHASE-2-M2.md §1).
    # api is the only service on both networks; runner containers join runner-egress only.
    networks: [internal, runner-egress]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # The only container with access to the real Docker socket (read-only), and even then
  # scoped to container lifecycle verbs only — see PLAN-PHASE-2-M2.md §2.1.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      SWARM: 0
      SERVICES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Claims jobs (acc.orchestrator.scheduler, M1) and launches/stops runner containers
  # (acc.orchestrator.launcher, M2) via docker-socket-proxy. Never joins runner-egress
  # itself — only the containers it launches do.
  orchestrator:
    build: ./backend
    image: acc-api:local
    command: ["python", "-m", "acc.orchestrator.main"]
    environment:
      <<: *api-env
      ACC_RUNNER_IMAGE: acc-runner:local
      ACC_RUNNER_NETWORK: acc_runner-egress
      ACC_DOCKER_PROXY_URL: tcp://docker-socket-proxy:2375
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    # This process serves no HTTP endpoint, unlike api (same image) — the image's own
    # Dockerfile HEALTHCHECK assumes one and would otherwise report unhealthy forever.
    healthcheck:
      disable: true
    networks: [internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # Never started by `up` — built on demand (`docker compose build runner`) and launched
  # per-run, dynamically, by the orchestrator. One container per run, ephemeral.
  runner:
    build: ./runner
    image: acc-runner:local
    profiles: ["build-only"]

  web:
    build: ./apps/web
    image: acc-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # The only service with published ports.
  caddy:
    image: caddy:2-alpine
    ports:
      - "${ACC_HTTP_PORT:-80}:80"
      - "${ACC_HTTPS_PORT:-443}:443"
    environment:
      ACC_SITE_ADDRESS: ${ACC_SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: *logging

networks:
  edge: {}
  # compose.prod.yml makes this network internal-only (no route to the internet).
  internal: {}
  # Runner containers join this and nothing else — no route to postgres/redis, ever
  # (PLAN-PHASE-2-M2.md §1). api also joins it, so runners can reach /internal/*.
  runner-egress: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
