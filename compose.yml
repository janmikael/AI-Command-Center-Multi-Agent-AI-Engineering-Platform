# AI Command Center: full stack.
#   First run:  scripts/init-env.sh   (creates .env with random secrets)
#   Start:      docker compose up -d --build --wait
#   Dev mode:   docker compose -f compose.yml -f compose.dev.yml up -d --build --wait
#   Production: docker compose -f compose.yml -f compose.prod.yml up -d --build --wait
name: acc

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  ACC_ENV: ${ACC_ENV:-development}
  ACC_DATABASE_URL: postgresql+asyncpg://acc_app:${ACC_APP_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/acc
  ACC_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://acc_owner:${ACC_OWNER_DB_PASSWORD:?run scripts/init-env.sh}@postgres:5432/acc
  ACC_REDIS_URL: redis://:${REDIS_PASSWORD:?run scripts/init-env.sh}@redis:6379/0
  ACC_SESSION_SECRET: ${ACC_SESSION_SECRET:?run scripts/init-env.sh}
  ACC_PUBLIC_ORIGIN: ${ACC_PUBLIC_ORIGIN:-http://localhost}
  ACC_LOG_LEVEL: ${ACC_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: postgres
      # Consumed once by infra/postgres/init/01-roles.sh on first start.
      ACC_OWNER_DB_PASSWORD: ${ACC_OWNER_DB_PASSWORD}
      ACC_APP_DB_PASSWORD: ${ACC_APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the init phase listens on the socket only, so this passes only once init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d acc"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped
    logging: *logging

  # One-shot: applies migrations as the schema owner, then exits. The API waits for it.
  migrate:
    build: ./backend
    image: acc-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  api:
    build: ./backend
    image: acc-api:local
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  web:
    build: ./apps/web
    image: acc-web:local
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging

  # The only service with published ports.
  caddy:
    image: caddy:2-alpine
    ports:
      - "${ACC_HTTP_PORT:-80}:80"
      - "${ACC_HTTPS_PORT:-443}:443"
    environment:
      ACC_SITE_ADDRESS: ${ACC_SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [edge, internal]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: *logging

networks:
  edge: {}
  # compose.prod.yml makes this network internal-only (no route to the internet).
  internal: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
