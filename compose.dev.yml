# Development overrides: hot reload for api + web, database and redis reachable from WSL
# (for psql and the backend test suite). Bound to 127.0.0.1 only.
services:
  postgres:
    ports: ["127.0.0.1:${ACC_PG_PORT:-5432}:5432"]

  redis:
    ports: ["127.0.0.1:${ACC_REDIS_PORT:-6379}:6379"]

  # For the backend test suite's launcher tests, which create real containers through it
  # (PLAN-PHASE-2-M2.md §5) — the same restricted proxy the orchestrator uses, not a
  # separate, more permissive one.
  docker-socket-proxy:
    ports: ["127.0.0.1:${ACC_DOCKER_PROXY_PORT:-2375}:2375"]

  # A hermetic git remote for the launcher's git-touching tests (PLAN-PHASE-2-M3.md §7).
  # On runner-egress, the same network a launched runner container joins, so its real
  # clone/push actually reaches this — no dependency on any real hosting provider.
  git-test-server:
    build: ./infra/git-test-server
    image: acc-git-test-server:local
    volumes:
      - git_test_repo:/repos
    networks: [runner-egress]
    restart: unless-stopped

  api:
    command: ["uvicorn", "acc.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--reload", "--reload-dir", "/app/src",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    environment:
      # Source on the bind mount shadows the installed package.
      PYTHONPATH: /app/src
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/alembic:/app/alembic:ro

  web:
    # Run `next dev` straight from the host checkout (repo lives on the WSL filesystem,
    # and node:22-slim is glibc like WSL Ubuntu, so the host node_modules work as-is).
    build: !reset null
    image: node:22-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: ["node_modules/.bin/next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web:/app
    read_only: false
    tmpfs: !reset []
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 6

volumes:
  git_test_repo:
