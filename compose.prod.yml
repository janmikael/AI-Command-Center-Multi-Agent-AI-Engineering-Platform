# Production overrides. Requires in .env:
#   ACC_ENV=production
#   ACC_PUBLIC_ORIGIN=https://<your-host>
#   ACC_SITE_ADDRESS=<your-host>        (Caddy obtains the TLS certificate)
services:
  api:
    deploy:
      resources:
        limits: { memory: 512M }
  web:
    deploy:
      resources:
        limits: { memory: 512M }
  postgres:
    deploy:
      resources:
        limits: { memory: 1G }
  redis:
    deploy:
      resources:
        limits: { memory: 256M }
  orchestrator:
    deploy:
      resources:
        limits: { memory: 256M }
  docker-socket-proxy:
    deploy:
      resources:
        limits: { memory: 128M }

networks:
  # Data services and app containers get no route to the internet.
  internal:
    internal: true
  # Deliberately NOT internal:true — runner containers need real internet access from
  # M3 onward (the Anthropic API, git remotes, package registries). It has no route to
  # `internal` regardless (a separate network, not a wider one), so this doesn't weaken
  # the postgres/redis isolation above.
